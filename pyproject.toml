[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mini-mart-receipt"
version = "0.1.0"
description = "AI Mini Mart printable token receipts."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "AI Mini Mart" }
]
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
ai-mini-mart-receipt = "ai_mini_mart_receipt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_mini_mart_receipt = ["assets/*.png"]
